<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration Form</title>
</head>

<body>

<header>
    <h1>Registration</h1>
    <p>Please fill the form carefully</p>
    <hr>
</header>

<main>

<section>
<form>

<fieldset>
    <legend>Personal Details</legend>

    <label>Full Name:</label><br>
    <input type="text" placeholder="Enter your name" required><br><br>

    <label>Email:</label><br>
    <input type="email" placeholder="example@gmail.com" required><br><br>

    <label>Password:</label><br>
    <input type="password" minlength="6" required><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" pattern="[0-9]{10}" placeholder="10 digit number" required><br><br>

    <label>Date of Birth:</label><br>
    <input type="date" required><br><br>
</fieldset>

<br>

<fieldset>
    <legend>Gender</legend>

    <input type="radio" name="gender" required> Male <br>
    <input type="radio" name="gender"> Female <br>
    <input type="radio" name="gender"> Other <br>
</fieldset>

<br>

<fieldset>
    <legend>Skills</legend>

    <input type="checkbox"> HTML <br>
    <input type="checkbox"> CSS <br>
    <input type="checkbox"> JavaScript <br>
</fieldset>

<br>

<fieldset>
    <legend>Address</legend>

    <textarea rows="4" placeholder="Enter full address"></textarea>
</fieldset>

<br>

<label>Select Country:</label><br>
<select required>
    <option value="">--Select--</option>
    <option>India</option>
    <option>USA</option>
    <option>UK</option>
</select>

<br><br>

<input type="checkbox" required>
I agree to the terms & conditions

<br><br>

<button type="submit">Register</button>
<button type="reset">Clear</button>

</form>
</section>

</main>

<hr>

<footer>
    <p> Registration </p>
</footer>

</body>
</html>
